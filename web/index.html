<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minecraft server status</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 10'><rect width='10' height='10' fill='%234c8c3a'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e9efe6; --card:#f7faf4; --ink:#1d2a21; --muted:#5b6b5f; --line:#c9d6c5;
  --on:#3f8a2f; --off:#b3392c; --wait:#c58a0e;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#17211a; --card:#1f2c23; --ink:#e6efe2; --muted:#9bb0a0; --line:#34463a;
        --on:#6cc255; --off:#e0675a; --wait:#e3ad3a; color-scheme:dark;}
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 "IBM Plex Sans",system-ui,sans-serif;
  padding:max(20px,env(safe-area-inset-top)) 20px max(28px,env(safe-area-inset-bottom));}
main{max-width:520px;margin:0 auto}
h1{font:700 15px/1.3 "Silkscreen",monospace;margin:0 0 18px;color:var(--muted);letter-spacing:.02em}
.hero{background:var(--card);border:2px solid var(--ink);padding:22px 20px;display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.lamp{width:72px;height:72px;display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.lamp i{background:var(--c,var(--muted));display:block}
.lamp i:nth-child(2),.lamp i:nth-child(4),.lamp i:nth-child(6),.lamp i:nth-child(8){opacity:.55}
.state{font:700 30px/1.1 "Silkscreen",monospace;color:var(--c,var(--ink))}
.sub{color:var(--muted);margin-top:6px;font-size:14px}
.hero.on{--c:var(--on)} .hero.off{--c:var(--off)} .hero.wait{--c:var(--wait)}
.hero.wait .lamp i{animation:blink 1.6s steps(2) infinite}
.hero.wait .lamp i:nth-child(odd){animation-delay:.8s}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.hero.wait .lamp i{animation:none}}
section{margin-top:18px}
h2{font:700 13px/1.3 "Silkscreen",monospace;margin:0 0 8px;color:var(--muted)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:1px solid var(--line);padding:12px 14px;margin-bottom:8px}
.row b{display:block;font-weight:600;word-break:break-all}
.row small{color:var(--muted)}
button{font:600 14px "IBM Plex Sans",sans-serif;background:var(--ink);color:var(--bg);border:0;padding:9px 14px;cursor:pointer;min-width:64px}
button:focus-visible{outline:3px solid var(--wait);outline-offset:2px}
dl{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:0;background:var(--card);border:1px solid var(--line);padding:14px}
dt{color:var(--muted)} dd{margin:0;text-align:right;font-weight:500;word-break:break-word}
.players{margin-top:8px;color:var(--muted);font-size:14px}
.setup{background:var(--card);border-left:6px solid var(--wait);padding:12px 14px;font-size:15px}
footer{margin-top:22px;color:var(--muted);font-size:13px;text-align:center}
.hidden{display:none}
</style>
</head>
<body>
<main>
  <h1 id="title">Minecraft server</h1>

  <div class="hero wait" id="hero" role="status" aria-live="polite">
    <div class="lamp" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div>
      <div class="state" id="state">Checking</div>
      <div class="sub" id="sub">Contacting the server...</div>
    </div>
  </div>

  <section id="setupBox" class="hidden">
    <h2>Server setup</h2>
    <div class="setup" id="setup"></div>
  </section>

  <section>
    <h2>How to join</h2>
    <div id="addrs"></div>
  </section>

  <section>
    <h2>Details</h2>
    <dl>
      <dt>Name</dt><dd id="dName">-</dd>
      <dt>Players</dt><dd id="dPlayers">-</dd>
      <dt>Version</dt><dd id="dVersion">-</dd>
      <dt>Last check</dt><dd id="dChecked">-</dd>
    </dl>
    <div class="players" id="plist"></div>
  </section>

  <footer>Refreshes every 30 seconds</footer>
</main>

<script>
// ===== EDIT THESE (or use ?host=1.2.3.4&edition=java-geyser in the page URL) =====
const CONFIG = {
  name: "LDS SMP",
  host: "",                 // your VM's public IP or domain; empty = not created yet
  edition: "java-geyser",       // "bedrock" | "java" | "java-geyser"
  javaPort: 25565,
  bedrockPort: 19132,
  repo: "AllensCreations/oci-minecraft"  // GitHub repo, to show setup progress; "" to hide
};
// ================================================================================

const q = new URLSearchParams(location.search);
for (const k of ["name","host","edition","repo"]) if (q.get(k) !== null) CONFIG[k] = q.get(k);
const $ = id => document.getElementById(id);
const hasJava = CONFIG.edition === "java" || CONFIG.edition === "java-geyser";
const hasBedrock = CONFIG.edition === "bedrock" || CONFIG.edition === "java-geyser";

$("title").textContent = CONFIG.name;
document.title = CONFIG.name + " status";

function setHero(cls, state, sub){
  $("hero").className = "hero " + cls;
  $("state").textContent = state;
  $("sub").textContent = sub;
}
function ago(iso){
  const s = Math.max(0, (Date.now() - new Date(iso)) / 1000);
  if (s < 90) return "just now";
  if (s < 5400) return Math.round(s / 60) + " min ago";
  if (s < 129600) return Math.round(s / 3600) + " h ago";
  return Math.round(s / 86400) + " days ago";
}
function addrRow(label, text){
  const row = document.createElement("div"); row.className = "row";
  const left = document.createElement("div");
  const b = document.createElement("b"); b.textContent = text;
  const s = document.createElement("small"); s.textContent = label;
  left.append(b, s);
  const btn = document.createElement("button"); btn.textContent = "Copy";
  btn.onclick = async () => {
    try { await navigator.clipboard.writeText(text); btn.textContent = "Copied"; }
    catch { btn.textContent = "Press and hold"; }
    setTimeout(() => btn.textContent = "Copy", 1600);
  };
  row.append(left, btn);
  return row;
}
function renderAddrs(){
  const box = $("addrs"); box.textContent = "";
  if (!CONFIG.host){
    const d = document.createElement("div"); d.className = "row";
    d.textContent = "The address appears here once your VM exists. Set host in this page's CONFIG.";
    box.append(d); return;
  }
  if (hasJava) box.append(addrRow("Java Edition", CONFIG.host + (CONFIG.javaPort === 25565 ? "" : ":" + CONFIG.javaPort)));
  if (hasBedrock){
    box.append(addrRow("Bedrock address", CONFIG.host));
    box.append(addrRow("Bedrock port", String(CONFIG.bedrockPort)));
  }
}

async function getJSON(url){
  const r = await fetch(url, {cache: "no-store"});
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

async function checkServer(){
  const tries = [];
  if (hasJava) tries.push(getJSON(`https://api.mcsrvstat.us/3/${CONFIG.host}:${CONFIG.javaPort}`));
  if (hasBedrock) tries.push(getJSON(`https://api.mcsrvstat.us/bedrock/3/${CONFIG.host}:${CONFIG.bedrockPort}`));
  const res = (await Promise.allSettled(tries)).filter(r => r.status === "fulfilled").map(r => r.value);
  if (!res.length) throw new Error("lookup failed");
  return res.find(r => r.online) || res[0];
}

let setupCache = null, setupAt = 0;   // GitHub allows 60 anonymous calls/hour, so check every 5 min
async function checkSetup(){
  if (!CONFIG.repo) return null;
  if (Date.now() - setupAt < 300000) return setupCache;
  setupAt = Date.now();
  try {
    const wf = await getJSON(`https://api.github.com/repos/${CONFIG.repo}/actions/workflows/retry.yml`);
    const runs = await getJSON(`https://api.github.com/repos/${CONFIG.repo}/actions/workflows/retry.yml/runs?per_page=1`);
    setupCache = {state: wf.state, run: (runs.workflow_runs || [])[0]};
    return setupCache;
  } catch { return setupCache; }
}

async function refresh(){
  $("dChecked").textContent = new Date().toLocaleTimeString();
  if (!CONFIG.host){   // the workflow writes config.json with the VM's IP once the server exists
    try { const c = await getJSON("config.json?" + Date.now()); if (c.host) CONFIG.host = c.host; } catch {}
  }
  renderAddrs();
  const setup = await checkSetup();
  let online = false;

  if (CONFIG.host){
    try {
      const s = await checkServer();
      online = !!s.online;
      if (online){
        const max = s.players && s.players.max != null ? s.players.max : "?";
        const now = s.players && s.players.online != null ? s.players.online : 0;
        setHero("on", "Online", now + " of " + max + " players right now");
        $("dName").textContent = (s.motd && s.motd.clean && s.motd.clean[0]) || CONFIG.name;
        $("dPlayers").textContent = now + " / " + max;
        $("dVersion").textContent = s.version || "-";
        const names = s.players && s.players.list ? s.players.list.map(p => p.name) : [];
        $("plist").textContent = names.length ? "Online: " + names.join(", ") : "";
      } else {
        setHero("off", "Offline", "The address is set but the server is not answering. It may be starting or restarting.");
        $("dName").textContent = CONFIG.name; $("dPlayers").textContent = "-"; $("dVersion").textContent = "-"; $("plist").textContent = "";
      }
    } catch {
      setHero("wait", "Unknown", "Could not reach the status lookup. Trying again soon.");
    }
  } else {
    setHero("wait", "Not ready", "Waiting for Oracle to create the VM. No address yet.");
    $("dName").textContent = CONFIG.name;
  }

  // GitHub setup progress (hidden once online)
  const box = $("setupBox");
  if (setup && !online){
    let msg;
    if (setup.state !== "active") msg = "The VM was created and the retry job has stopped. If the server is offline, it is installing; check the latest run in GitHub Actions.";
    else if (setup.run) msg = "Still waiting for free Oracle capacity. The job retries every 10 minutes. Last attempt " + ago(setup.run.updated_at) + " (" + (setup.run.status === "completed" ? "finished" : setup.run.status) + ").";
    else msg = "The retry job has not run yet.";
    $("setup").textContent = msg;
    box.classList.remove("hidden");
  } else box.classList.add("hidden");
}

refresh();
setInterval(refresh, 30000);
</script>
</body>
</html>
