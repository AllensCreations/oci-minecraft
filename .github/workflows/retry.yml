name: Retry OCI stack apply

# Triggered from cron-job.org (workflow_dispatch). No GitHub schedule.
on:
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: oci-retry
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: "True"
    steps:
      - uses: actions/checkout@v4

      - name: Install OCI CLI
        run: pip install oci-cli

      - name: Configure OCI
        env:
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_KEY: ${{ secrets.OCI_KEY }}
        run: bash scripts/oci_config.sh

      - name: Try to apply stack
        id: apply
        env:
          STACK_ID: ${{ secrets.OCI_STACK_ID }}
        run: bash scripts/try_apply.sh

      - name: Install and configure Minecraft server
        id: deploy
        if: steps.apply.outputs.result == 'SUCCEEDED'
        env:
          STACK_ID: ${{ secrets.OCI_STACK_ID }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REQUIRE_VM: "1"
          SKIP_IF_INSTALLED: "1"
        run: bash scripts/deploy_all.sh

      - name: Publish server address for the status page
        if: always() && steps.deploy.outputs.ip != ''
        continue-on-error: true
        run: bash scripts/publish_address.sh "${{ steps.deploy.outputs.ip }}"

      - name: Notify - server ready
        if: always() && steps.deploy.outcome == 'success' && steps.deploy.outputs.ip != ''
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: bash scripts/notify.sh "Minecraft server ready" "Server address - ${{ steps.deploy.outputs.ip }}"

      - name: Notify - problem
        if: failure() && steps.apply.outputs.result == 'SUCCEEDED'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: bash scripts/notify.sh "Minecraft install failed" "The VM exists but setup failed. Check GitHub Actions."

      - name: Disable retry workflow
        if: steps.apply.outputs.result == 'SUCCEEDED'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable "Retry OCI stack apply" --repo "${{ github.repository }}"
