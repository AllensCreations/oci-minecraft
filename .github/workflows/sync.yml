name: Sync Minecraft server

# Runs when you change anything in minecraft/ (settings, packs, world).
on:
  push:
    paths:
      - 'minecraft/**'
      - 'scripts/server_setup.sh'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oci-retry
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install OCI CLI
        run: pip install oci-cli
      - name: Configure OCI
        env:
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_KEY: ${{ secrets.OCI_KEY }}
        run: bash scripts/oci_config.sh
      - name: Deploy to server (skips if no VM yet)
        id: deploy
        env:
          STACK_ID: ${{ secrets.OCI_STACK_ID }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REQUIRE_VM: "0"
        run: bash scripts/deploy_all.sh
      - name: Publish server address for the status page
        if: always() && steps.deploy.outputs.ip != ''
        run: bash scripts/publish_address.sh "${{ steps.deploy.outputs.ip }}"
